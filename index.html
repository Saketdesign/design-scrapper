<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Design Scrapper</title>
    <link rel="stylesheet" href="css/app.css">
    <script type="text/javascript" src="js/main.js"></script>
    <script type="text/javascript" src="js/ui.js" defer></script>
</head>

<body>
    <div class="app">
        <header class="header">
            <div class="brand">
                <h1 id="title" data-text="Design Scrapper">Design Scrapper</h1>
                <p class="eyebrow">New UI designs · once a day · into Uncategorized</p>
            </div>
            <div class="run-controls">
                <div id="range" class="segmented" role="radiogroup" aria-label="Which posts to import when you click Run">
                    <span class="segmented-thumb" aria-hidden="true"></span>
                </div>
                <button id="runAll" class="btn primary">Run all now</button>
            </div>
        </header>

        <section id="runPanel" class="run-panel" hidden>
            <div class="run-head">
                <span class="run-icon"><svg class="spin" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" opacity=".25"/><path d="M8 2a6 6 0 0 1 6 6"/></svg></span>
                <div class="run-heading">
                    <div id="runTitle" class="run-title"></div>
                    <div id="runSub" class="run-sub"></div>
                </div>
                <span id="runPct" class="run-pct"></span>
            </div>
            <div class="run-bar"><span id="runBar"></span></div>
            <ul id="runSteps" class="run-steps"></ul>
            <div class="run-tip">
                <span id="tipDots" class="tip-dots" aria-hidden="true"></span>
                <span id="tipText" class="tip-text"></span>
            </div>
        </section>

        <section>
            <div class="section-title">
                <h2>Sources</h2>
                <span id="sourceCount" class="count"></span>
            </div>
            <ul id="sources" class="card list"></ul>
            <form id="addForm" class="add">
                <input id="addUrl" type="text" placeholder="Paste a website link, e.g. https://vibrant.design/" autocomplete="off" spellcheck="false">
                <button class="btn explore" type="submit">
                    <span>Add source</span>
                    <span class="explore-icon"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></span>
                </button>
            </form>
            <p id="addError" class="error" hidden></p>
        </section>

        <section>
            <div class="section-title">
                <h2>Recent imports</h2>
                <div id="filter" class="filter" hidden>
                    <button id="filterBtn" class="filter-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
                    <div id="filterMenu" class="menu" hidden></div>
                </div>
            </div>
            <div id="activity" class="card timeline"></div>
        </section>

        <footer class="eyebrow">Checks every hour while Eagle is open · each source runs once every 24 h</footer>
    </div>

    <div id="selectionBar" class="selection-bar" hidden>
        <span id="selCount" class="sel-count"></span>
        <button class="icon-btn" data-sel="clear" title="Clear selection (Esc)"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
        <span class="sel-sep"></span>
        <button class="btn sm" data-sel="run">Run</button>
        <button class="btn sm danger" data-sel="remove">Remove</button>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <div id="modal" class="modal-backdrop" hidden>
        <div class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-art"><svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg></div>
            <div class="modal-body">
                <h3 id="modalTitle"></h3>
                <dl id="modalRows" class="modal-rows"></dl>
                <p id="modalDetail" class="modal-detail"></p>
            </div>
            <div class="modal-actions">
                <button id="modalCancel" class="btn">Cancel</button>
                <button id="modalConfirm" class="btn primary"></button>
            </div>
        </div>
    </div>
</body>
</html>
